name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Windows runs the same gate so the service manager's Windows paths
    # (Scripts\*.exe layout, taskkill /T, tasklist PID checks) are exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Test against the bytes in git, not a CRLF-converted checkout.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned in package.json `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  smoke:
    # Loads the unpacked extension into the runner's preinstalled Chrome.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm run smoke
